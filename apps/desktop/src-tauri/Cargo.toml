[package]
name = "ide-desktop"
version = "0.1.0-alpha"
description = "IDE Desktop Application"
authors = ["IDE Team"]
edition = "2021"
rust-version = "1.89"
default-run = "ide-desktop"

[lib]
name = "ide_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
url = "2"
percent-encoding = "2"
arc-swap = "1"
base64 = "0.22"
getrandom = "0.3"
git2 = { version = "0.20.2", default-features = false, features = ["vendored-libgit2"] }
portable-pty = "0.9"
regex = "1"
cesu8 = "1.1"
quick-xml = "0.39.4"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Text-only clipboard access. arboard is MIT OR Apache-2.0 licensed; image support is disabled.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
tauri = { version = "2", features = ["default"] }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v5"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
